# L5 merge gate: plan approval, archive, Tier 0 reason, status label, PR template.
# Deterministic bash, no LLM. Required by the ruleset on main (check name: plan-gate).
name: plan-gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

concurrency:
  group: plan-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  plan-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gate's own scripts come from the base branch, so a PR cannot loosen
      # the check that judges it. Bootstrap: fall back to the PR's copy once.
      - name: Gate scripts from base
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/gate"
          for f in plan-gate.sh check-plan.sh; do
            if git show "$BASE:scripts/$f" > "$RUNNER_TEMP/gate/$f" 2>/dev/null; then
              echo "scripts/$f from $BASE"
            else
              echo "::warning::scripts/$f is not on $BASE yet; using the PR's copy (bootstrap)."
              cp "scripts/$f" "$RUNNER_TEMP/gate/$f"
            fi
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (for openspec)
        run: pnpm install --frozen-lockfile

      - name: Plan gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: bash "$RUNNER_TEMP/gate/plan-gate.sh" "origin/${{ github.event.pull_request.base.ref }}"
